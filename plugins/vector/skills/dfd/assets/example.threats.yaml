  - element: support-render
    category: stride/information_disclosure
    verdict: threat
    nodes: [DR01]
    summary: >-
      The full order record lands on a staff laptop in a zone the model itself
      declares untrusted, and no device control is recorded anywhere.
    detail: >-
      This flow crosses `prod-vpc` to `corp-net`, and the model's own
      assumptions say "The corporate network is not trusted; the support
      console authenticates every request regardless of network position". That
      assumption is honoured for authentication and then abandoned for data:
      `order`, `address` and `email` are rendered onto a device in the
      untrusted zone. Nothing in the model records disk encryption, screenshot
      or clipboard restrictions, endpoint management, or anything else about
      what happens to the data once it arrives. `notes` records the masking,
      which governs whether the address is shown, not what the laptop does with
      it afterwards.
