      `email`: the identifier is left behind because the assistant has no use
      for it. DD.3.2 would need data to travel further than the function
      requires, and this flow was cut to the function.

  - element: assist-request
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      Same `lawful_basis: Contract` the source data already carries, and
      `shopper-message` states a retention that matches the ticket it belongs
      to.

  - element: assist-draft
    category: stride/tampering
    verdict: controlled
    reason: >-
      TLS 1.3 and an IAM role inside the VPC. The console does not treat what
      comes back as markup either — `support-assistant.output_handling` renders
      the draft as plain text, never as HTML.

  - element: assist-draft
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      TLS 1.3 inside the VPC. That the draft can contain a masked address is
      recorded against `support-assistant`, where the decision to include it is
      made.

  - element: assist-draft
    category: stride/denial_of_service
    verdict: controlled
    reason: One response per request; losing it costs a draft, not the ticket.

  - element: assist-draft
    category: linddun/linking
    verdict: controlled
    reason: Carries one draft about one order and nothing that joins tickets.

  - element: assist-draft
    category: linddun/identifying
    verdict: controlled
    reason: >-
      `draft-reply` is a statement about the shopper whose ticket it answers;
      naming them back to themselves is the point.

  - element: assist-draft
    category: linddun/non_repudiation
    verdict: controlled
    reason: Deliberate, per `audit-event.notes`; recorded by `assist-audit`.

  - element: assist-draft
    category: linddun/detecting
    verdict: not_applicable
    reason: Process to process inside `prod-vpc`, unobservable from outside.

  - element: assist-draft
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      One draft, to the console that asked for it, kept for as long as the
      ticket per `draft-reply.retention`. It goes no further without an agent
      pressing send.

  - element: assist-draft
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      `support-assistant.output_handling` means nothing generated reaches a
      shopper unreviewed, so a wrong statement is caught by a person before it
      becomes something to rectify.

  - element: assist-audit
    category: stride/tampering
    verdict: controlled
    reason: TLS 1.3, IAM role, append-only destination with object lock.

  - element: assist-audit
    category: stride/information_disclosure
    verdict: controlled
    reason: Write-only into the log; the path cannot be reversed to read history.

  - element: assist-audit
    category: stride/denial_of_service
    verdict: controlled
    reason: One event per draft, and a draft requires an authenticated agent.

  - element: assist-audit
    category: linddun/linking
    verdict: controlled
    reason: >-
      Links an agent, a shopper's order and a prompt, which is the
      accountability the log exists for.

  - element: assist-audit
    category: linddun/identifying
    verdict: controlled
    reason: >-
      Carries `audit-event` only, so the entry names the order rather than
      restating the shopper's address. What the log's retention costs is
      recorded against `audit-log`.

  - element: assist-audit
    category: linddun/non_repudiation
    verdict: controlled
    reason: Deliberate for staff, per `audit-event.notes`.

  - element: assist-audit
    category: linddun/detecting
    verdict: not_applicable
    reason: Service to store inside `prod-vpc`, unobservable from outside.

  - element: assist-audit
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      Carries only what the audit entry needs to be meaningful. The prompt text
      it references includes `shopper-message`, so what two-year retention costs
      is recorded against `audit-log` with the rest of the log's duration
      finding.

  - element: assist-audit
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      Legal-obligation basis, same as the other audit writes. The erasure
      conflict it contributes to is recorded against `audit-log`.

  - element: dsar-request
    category: stride/tampering
    verdict: controlled
    reason: >-
      TLS 1.3, and `authz` on the handler is a two-person rule for erasure, so
      a tampered request cannot by itself destroy anything.
  - element: dsar-request
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      Carries `email` inbound over TLS 1.3. What goes back out is
      `dsar-export`, and the verification it depends on is recorded as a
      finding against `dsar-handler`.
  - element: dsar-request
    category: stride/denial_of_service
    verdict: controlled
    reason: >-
      `trigger: user_action` but every run is manual and approved, so volume
      costs human time rather than availability.
  - element: dsar-request
    category: linddun/linking
    verdict: controlled
    reason: >-
      A person asking about their own data necessarily links themselves to it.
  - element: dsar-request
    category: linddun/identifying
    verdict: controlled
    reason: >-
      Identification is the prerequisite: an unidentified request cannot be
      answered safely. Whether it is identification enough is the spoofing
      finding on `dsar-handler`.
  - element: dsar-request
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      `dsar-handler.logging` records every request and approval, which is what
      makes the response defensible to a regulator.
  - element: dsar-request
    category: linddun/detecting
    verdict: controlled
    reason: >-
      A request is submitted before any response exists. Whether a reply
      distinguishes a known address from an unknown one is recorded against
      `checkout-api`.
  - element: dsar-request
    category: linddun/data_disclosure
    verdict: threat
    nodes: [DD.1.1, DD.3.4]
    summary: >-
      Verifying a guest collects identity documents that appear nowhere in the
      data dictionary.
    detail: >-
      `authn` is "Identity verification against the account, or documentary
      proof for guests". Documentary proof means an identity document — among
      the most sensitive categories of personal data there is — arriving by
      HTTPS form or by email to the privacy inbox. No `data` entry exists for
      it. So it has no `classification`, no `personal_data` level, no
      `lawful_basis`, no `retention`, and no store modelled to hold it, which
      means nothing in this model can say whether it is deleted after the check
      or sitting in a mailbox indefinitely. The control that protects the
      rights process collects data the rights process cannot account for.
  - element: dsar-request
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      Having a route for access and erasure at all is what compliance asks
      first. The two failures of that route — gift recipients with no path, and
      guests who cannot prove identity — are recorded against `dsar-handler`.

  - element: dsar-read
    category: stride/tampering
    verdict: controlled
    reason: >-
      Verify-full TLS with IAM database authentication, and `authn` restricts
      it to an approved run rather than to anyone holding the role.
  - element: dsar-read
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      The broadest read in the model, and the one most tightly gated: approved
      run only, `trigger: manual`, inside `prod-vpc`.
  - element: dsar-read
    category: stride/denial_of_service
    verdict: controlled
    reason: >-
      Manual and approved, so it cannot be induced at volume.
  - element: dsar-read
    category: linddun/linking
    verdict: controlled
    reason: >-
      Assembling everything held about one person is what a subject access
      request is.
  - element: dsar-read
    category: linddun/identifying
    verdict: controlled
    reason: >-
      Works from an identified `email` the requester supplied.
  - element: dsar-read
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      The run is recorded with its approver, which is the audit an access
      request needs.
  - element: dsar-read
    category: linddun/detecting
    verdict: not_applicable
    reason: >-
      Store to service inside `prod-vpc`; nothing externally observable.
  - element: dsar-read
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      Reads everything held, because that is the request. It reads only
      `orders-db`, though — the `email` held in `audit-log` is not assembled,
      which is the completeness finding recorded there.
  - element: dsar-read
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      Serving access requests is the obligation. That the export is incomplete
      by construction is recorded against `audit-log`.

  - element: dsar-export
    category: stride/tampering
    verdict: controlled
    reason: >-
      `authn` is a one-time link tied to the verified identity with a 72-hour
      expiry, over TLS 1.3. A link that has been used cannot be re-used.
  - element: dsar-export
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      An expiring signed download link is the right shape for this, and it is
      as strong as the identity it is tied to — which is the spoofing finding
      against `dsar-handler`. The 72-hour window means the link outlives the
      request in whatever inbox received it, bounded by being one-time.
  - element: dsar-export
    category: stride/denial_of_service
    verdict: controlled
    reason: >-
      One link per approved run.
  - element: dsar-export
    category: linddun/linking
    verdict: controlled
    reason: >-
      Delivers one person's own record to them.
  - element: dsar-export
    category: linddun/identifying
    verdict: controlled
    reason: >-
      The link is tied to the verified identity, so identification is the
      control rather than the risk.
  - element: dsar-export
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      The export is logged, which is how we can show the request was answered.
  - element: dsar-export
    category: linddun/detecting
    verdict: controlled
    reason: >-
      A signed link reveals nothing to an observer who cannot open it, and it
      is single-use.
  - element: dsar-export
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      Discloses everything, to the person it is about. Sending less would fail
      the request rather than minimise it.
  - element: dsar-export
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      Delivering the export completes the obligation `dsar-request` opened. Its
      incompleteness is recorded against `audit-log`.
