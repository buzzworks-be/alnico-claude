# A worked enumeration of example.dfd.yaml, for both STRIDE and LINDDUN.
#
# Written by hand rather than produced by the agent. A fixture that came out of
# the thing it tests proves less than one that did not: this is what the
# coverage script is checked against, so it has to be independent of it.
#
# Every verdict names the field in the model that makes it true. A verdict that
# could have been written without reading the model is the failure mode the
# whole capability exists to avoid.

model: example.dfd.yaml
model_digest: sha256:31e0f0518615ca45413bbfb9ee597bb66a3e0bd496d918785996c4c8c289d9d8
analysis: [stride, linddun]

carried_forward:
  open_questions:
    - Nobody could confirm whether the nightly database snapshots are covered by
      the 90-day address purge, or whether they retain addresses for 35 days past it.
  assumptions:
    - Card numbers never reach our servers; Stripe Elements tokenises in-browser.
    - The corporate network is not trusted; the support console authenticates
      every request regardless of network position.

verdicts:

  # --- actors --------------------------------------------------------------

  - element: shopper
    category: stride/spoofing
    verdict: threat
    nodes: [AA01]
    summary: Guest checkout accepts an email address with no proof of control.
    detail: >-
      `authenticates_how` records guest checkout as anonymous, and `submit-order`
      carries `email` from the browser. Nothing binds that address to the person
      submitting it, so an order — and the confirmation containing it — can be
      directed at somebody else's address. The same gap widens at `dsar-request`,
      where the only thing standing between a stranger and an export is
      documentary proof a human judges.

  - element: shopper
    category: stride/repudiation
    verdict: controlled
    reason: >-
      Every order write goes through `checkout-api`, whose `logging` records
      structured audit events to `audit-log`, which is append-only with object
      lock. An authenticated shopper cannot plausibly deny placing an order.
      A guest can deny it, but that is the spoofing finding above rather than a
      second one.

  - element: shopper
    category: linddun/linking
    verdict: controlled
    reason: >-
      Linking a shopper's activity is the service working: `order` and `cart`
      are joined to a person on purpose, under `lawful_basis: Contract`. The
      linkability that is not deliberate is `session-id`, and it is recorded
      against `session-cache` rather than here.

  - element: shopper
    category: linddun/identifying
    verdict: controlled
    reason: >-
      The shopper is identified, deliberately. `email` carries
      `notes: Doubles as the login identifier, so it cannot be pseudonymised`
      and `lawful_basis: Contract`. Identification is the purpose, not a leak.

  - element: shopper
    category: linddun/unawareness
    verdict: threat
    nodes: [U.1.1, U.2.3]
    summary: >-
      Gift recipients are data subjects who have no way to know we hold their
      address, or to have it removed.
    detail: >-
      `address` records `subjects: Shoppers and their gift recipients` and
      `notes: Gift recipients never interact with us, which makes transparency
      harder`. Every path in the model that serves a data subject —
      `dsar-request`, `dsar-export` — starts from a shopper with an account or a
      documented identity. A recipient has neither, so there is no flow by which
      they could be informed or exercise erasure. The absence is the finding.

  - element: support-agent
    category: stride/spoofing
    verdict: controlled
    reason: >-
      `authenticates_how` is Okta SSO with mandatory WebAuthn, and
      `support-console.authn` binds the session to the device. A phishable
      factor is the usual way this fails and there is not one here.

  - element: support-agent
    category: stride/repudiation
    verdict: controlled
    reason: >-
      `support-console.logging` writes every lookup to `audit-log` with the
      agent identity and a reason, and `audit-event` carries
      `notes: Deliberately non-repudiable for staff`. That is the control
      working as designed.

  - element: stripe-api
    category: stride/spoofing
    verdict: controlled
    reason: >-
      Outbound, `charge.authn` is a restricted secret key rotated quarterly.
      Inbound, `charge-result.authn` is webhook signature verification, which is
      what stops an attacker claiming a charge succeeded.

  - element: stripe-api
    category: stride/repudiation
    verdict: controlled
    reason: >-
      Settlement is recorded on Stripe's side as well as ours, and
      `charge-result` arrives signed. Neither party can deny a charge that the
      other holds a signed record of.

  # --- processes -----------------------------------------------------------

  - element: checkout-web
    category: stride/spoofing
    verdict: controlled
    reason: >-
      `authn` is a session cookie issued by the API with no credentials held in
      the page, and `submit-order.authn` adds SameSite=Lax and a CSRF token.
      There is nothing in the page for an attacker to replay.

  - element: checkout-web
    category: stride/tampering
    verdict: controlled
    reason: >-
      The process sits in `trust_zone: browser`, described in the model as
      "fully under the shopper's control; nothing running here is trusted", so
      tampering is certain rather than possible. `authz: None — every decision
      is re-made server-side` is the answer, and it is the right one.

  - element: checkout-web
    category: stride/repudiation
    verdict: controlled
    reason: >-
      The page proves nothing and is not asked to. Attribution comes from
      `checkout-api.logging`, which writes audit events server-side where the
      shopper cannot reach them.

  - element: checkout-web
    category: stride/information_disclosure
    verdict: threat
    nodes: [DS06]
    summary: PII scrubbing on client error reports is a filter that fails open.
    detail: >-
      `logging` is "Client errors to Sentry with PII scrubbing on; no order
      contents". The page holds `address` and `email` at the moment an error is
      most likely, and scrubbing is pattern matching: a new field, a nested
      object or a stack frame capturing a local variable defeats it silently.
      Nothing in the model says the scrubber is tested, and a scrubber nobody
      tests is a claim rather than a control.

  - element: checkout-web
    category: stride/denial_of_service
    verdict: not_applicable
    reason: >-
      The process runs on the shopper's own device, in a trust zone they
      control. Denying it to themselves is not a threat to anyone else, and
      denying it to others means attacking the static asset host, which the
      model puts out of scope.

  - element: checkout-web
    category: stride/elevation_of_privilege
    verdict: not_applicable
    reason: >-
      `authz: None — every decision is re-made server-side`. The process holds
      no authority to escalate; the privileges worth attacking are all
      `checkout-api`'s, and they are enumerated there.

  - element: checkout-web
    category: linddun/linking
    verdict: controlled
    reason: >-
      The page holds one shopper's `cart` and `address` for one session. It
      joins nothing across people or visits; `session-cache` is where
      cross-request linkage lives.

  - element: checkout-web
    category: linddun/identifying
    verdict: controlled
    reason: >-
      It collects `email` and `address` from the person they belong to, which is
      collection rather than identification of someone who expected otherwise.

  - element: checkout-web
    category: linddun/non_repudiation
    verdict: not_applicable
    reason: >-
      Nothing here is evidence of anything. The page signs nothing, retains
      nothing, and `logging` explicitly excludes order contents.

  - element: checkout-web
    category: linddun/detecting
    verdict: controlled
    reason: >-
      Observing the page reveals that this shopper is shopping, to the shopper.
      Anything observable by a third party is on the wire, and belongs to the
      flows rather than here.

  - element: checkout-web
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      It collects exactly the fields `submit-order` carries — `cart`,
      `address`, `email`, `card-token` — each with a `lawful_basis` recorded in
      the data dictionary. Nothing is gathered that the order does not need.

  - element: checkout-web
    category: linddun/unawareness
    verdict: threat
    nodes: [U.1.1]
    summary: >-
      No element of the model represents how the shopper is told what is
      collected, or on what basis.
    detail: >-
      This is the only process the shopper sees, and it is where a privacy
      notice or a consent interaction would live. The model contains neither —
      no flow carries one, no store holds one, and `lawful_basis` is recorded
      per data item in the dictionary rather than shown to anybody. The
      information exists for the reviewer and not for the data subject, which
      is precisely the shape of an unawareness threat.

  - element: checkout-web
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      Every data item it handles carries a `lawful_basis` and a `retention` in
      the dictionary. The compliance risks that remain are retention and data
      subject rights, and both are recorded where they arise — `orders-db` and
      `dsar-handler`.

  - element: checkout-api
    category: stride/spoofing
    verdict: controlled
    reason: >-
      `authn` is mTLS from the edge proxy plus the shopper's session cookie for
      user context, so a caller has to hold both a client certificate and a
      session. `trust_zone: prod-vpc` has no inbound path except the proxy.

  - element: checkout-api
    category: stride/tampering
    verdict: controlled
    reason: >-
      Inputs arrive over `submit-order` with TLS 1.3 and a CSRF token, and
      `authz` re-checks row-level ownership on every order read or write, so a
      tampered request fails on the object it names rather than on its shape.

  - element: checkout-api
    category: stride/repudiation
    verdict: controlled
    reason: >-
      `logging` writes structured audit events to `audit-log`, which is
      append-only with object lock preventing deletion before expiry. The
      service cannot erase its own trail.

  - element: checkout-api
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      `logging` records request logs without bodies, which is the usual way
      addresses and emails end up somewhere nobody is guarding. Reads are
      constrained by the row-level ownership checks in `authz`.

  - element: checkout-api
    category: stride/denial_of_service
    verdict: threat
    nodes: [DO01]
    summary: >-
      Nothing in the model records a rate limit, and the order path reaches a
      third party on every request.
    detail: >-
      `submit-order` is `trigger: user_action` from an untrusted zone, and
      `charge` calls Stripe synchronously behind it. No field anywhere records
      throttling, quotas or a circuit breaker, so an unauthenticated flood costs
      us both database writes and third-party API quota. The absence of an
      answer is the finding; the interview recorded `authn` and `authz` for this
      process and nothing about availability.

  - element: checkout-api
    category: stride/elevation_of_privilege
    verdict: controlled
    reason: >-
      `authz` is row-level ownership checks on every order read or write, so
      holding a valid session grants no access to another shopper's order.
      `persist-order.authn` uses IAM database authentication rather than a
      shared credential the process could widen.

  - element: checkout-api
    category: linddun/linking
    verdict: controlled
    reason: >-
      It joins `cart` to `order` to a shopper, which `cart`'s own
      `notes: Purchase history is linkable to a person once joined to an order`
      identifies as deliberate and necessary under `lawful_basis: Contract`.

  - element: checkout-api
    category: linddun/identifying
    verdict: controlled
    reason: >-
      It handles `email` and `address` as identified data from the start, under
      a recorded contract basis. Nothing pseudonymous is re-identified here.

  - element: checkout-api
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      Its audit events concern orders rather than staff, and `audit-event`
      records `lawful_basis: Legal obligation`. A shopper being unable to deny
      their own order is the tax and fraud record working.

  - element: checkout-api
    category: linddun/detecting
    verdict: threat
    nodes: [D.3]
    summary: >-
      Nothing records whether the API's responses reveal that an email address
      belongs to a customer.
    detail: >-
      The process authenticates shoppers and, through `dsar-request`, receives
      requests keyed on `email`. Whether a lookup for an unknown address is
      distinguishable from one for a known address — by status code, message or
      timing — is not answered anywhere in the model. If it is, anybody can test
      whether a given person shops here, which is a detecting threat that needs
      no credentials at all.

  - element: checkout-api
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      It writes exactly `order`, `address` and `email` to `orders-db` per
      `persist-order`, and `audit-write` carries only `audit-event`. Nothing is
      propagated further than the order needs.

  - element: checkout-api
    category: linddun/unawareness
    verdict: controlled
    reason: >-
      The rights machinery exists as its own process, `dsar-handler`, with
      flows in and out. The gaps in it are recorded there and against `shopper`
      rather than duplicated here.

  - element: checkout-api
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      It enforces the contract basis it collects under and writes to stores
      whose retention is recorded. The storage-limitation risk lives with the
      store that keeps the data, which is where it is recorded.

  - element: fulfilment-worker
    category: stride/spoofing
    verdict: controlled
    reason: >-
      `authn` is an IAM role with no inbound network path, so there is no
      request to forge. Impersonating the worker requires the role, not a
      credential that travels.

  - element: fulfilment-worker
    category: stride/tampering
    verdict: controlled
    reason: >-
      `authz` is a read-only database role scoped to paid orders, so the worker
      cannot alter what it reads. `poll-orders.encryption_in_transit` is TLS
      verify-full, which stops interception on the way.

  - element: fulfilment-worker
    category: stride/repudiation
    verdict: controlled
    reason: >-
      `logging` writes an audit event per dispatched order to the append-only
      `audit-log`, so a dispatch cannot be denied or quietly un-recorded.

  - element: fulfilment-worker
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      It reads `order` and `address` under a read-only scoped role and pushes
      picking instructions onward. The warehouse itself is out of scope by
      declaration, and treated as a consumer of orders.

  - element: fulfilment-worker
    category: stride/denial_of_service
    verdict: controlled
    reason: >-
      `poll-orders` is `trigger: scheduled` with no inbound path, so there is no
      request an attacker can send it. Starving it means starving the database,
      which is recorded against `orders-db`.

  - element: fulfilment-worker
    category: stride/elevation_of_privilege
    verdict: controlled
    reason: >-
      A read-only role scoped to paid orders is the least privilege the job can
      do its work with, and `poll-orders.authn` binds it at the database rather
      than in application code.

  - element: fulfilment-worker
    category: linddun/linking
    verdict: controlled
    reason: >-
      It handles one order at a time and joins nothing across shoppers. The
      linkage it consumes was made in `checkout-api` under the contract basis.

  - element: fulfilment-worker
    category: linddun/identifying
    verdict: controlled
    reason: >-
      Delivery requires an identified recipient at a `address`. There is no
      pseudonymous data here being resolved to a person.

  - element: fulfilment-worker
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      Its audit events attribute dispatches to the system, not to a shopper.
      Nothing here makes a data subject unable to deny an action.

  - element: fulfilment-worker
    category: linddun/detecting
    verdict: not_applicable
    reason: >-
      It has no inbound path and returns nothing to anybody outside the VPC, so
      there is no response, timing or side effect an observer could read
      involvement from.

  - element: fulfilment-worker
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      `poll-orders` carries `order` and `address` and not `email`, which is the
      minimisation the job needs: a picker needs somewhere to send the parcel
      and not a way to contact the buyer.

  - element: fulfilment-worker
    category: linddun/unawareness
    verdict: not_applicable
    reason: >-
      No interface to a data subject exists here — no inbound path, no
      response. Awareness and intervention are `dsar-handler`'s and
      `checkout-web`'s, and are recorded there.

  - element: fulfilment-worker
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      It processes `order` and `address` for delivery, which is the contract
      basis both carry. Retention is not its decision; the store's.

  - element: support-console
    category: stride/spoofing
    verdict: controlled
    reason: >-
      `authn` is Okta SSO with WebAuthn enforced and the session bound to the
      device, and the model's assumptions state the corporate network is not
      trusted, so position on the network grants nothing.

  - element: support-console
    category: stride/tampering
    verdict: controlled
    reason: >-
      `support-read.authn` is a read-only database role, so the console cannot
      alter an order even if an agent wanted to. Lookups arrive over TLS 1.3.

  - element: support-console
    category: stride/repudiation
    verdict: controlled
    reason: >-
      `logging` writes every lookup to `audit-log` with the agent identity and
      a reason, into an append-only store the console cannot write over.

  - element: support-console
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      Reads are scoped by a read-only role, addresses are masked by default per
      `authz`, and every unmasking is recorded. The residual risk is an
      authorised agent looking at more than they need, which is the data
      disclosure finding below rather than a second one here.

  - element: support-console
    category: stride/denial_of_service
    verdict: controlled
    reason: >-
      It sits behind the SSO proxy in `prod-vpc` with no anonymous surface, so
      an attacker needs an Okta session with WebAuthn before they can send it
      anything at all.

  - element: support-console
    category: stride/elevation_of_privilege
    verdict: controlled
    reason: >-
      `authz` is role-based and the database role is read-only, so the highest
      privilege reachable from here is reading an order — which is the console's
      whole purpose rather than an escalation.

  - element: support-console
    category: linddun/linking
    verdict: controlled
    reason: >-
      An agent looks up one order at a time by email or order number. Nothing
      here assembles a profile across shoppers, and every lookup is recorded.

  - element: support-console
    category: linddun/identifying
    verdict: controlled
    reason: >-
      It deals in identified data by design — an agent answering a query needs
      to know whose order it is. Nothing pseudonymous is resolved here.

  - element: support-console
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      The non-repudiation it creates is of staff actions, and `audit-event`
      records that as deliberate: "Deliberately non-repudiable for staff, which
      is a LINDDUN cost accepted on purpose".

  - element: support-console
    category: linddun/detecting
    verdict: controlled
    reason: >-
      Its only users are authenticated agents inside `prod-vpc`. There is no
      unauthenticated response from which an outsider could deduce that a
      person is a customer.

  - element: support-console
    category: linddun/data_disclosure
    verdict: threat
    nodes: [DD.4.1.1, DD.1.2]
    summary: >-
      Address masking is lifted by the agent who wants to see the address, with
      no second party in the loop.
    detail: >-
      `authz` records that "addresses are masked unless the agent opens a
      ticket-linked view". Nothing in the model says who verifies that the
      ticket is real, relevant, or the shopper's own — so the control is a
      speed bump on a path the agent controls both ends of. `logging` makes
      every unmasking visible afterwards, which makes this detective rather
      than preventive, and worth deciding about deliberately: compare
      `dsar-handler`, which has a two-person rule for a comparable action.

  - element: support-console
    category: linddun/unawareness
    verdict: not_applicable
    reason: >-
      Its users are staff, not data subjects. A shopper never reaches this
      process, so it can neither inform them nor take instruction from them;
      those paths are `checkout-web`'s and `dsar-handler`'s.

  - element: support-console
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      Access is logged with a stated reason, which is what an audit of support
      access asks for, and the read-only role prevents the console becoming a
      way to change records outside the order path.

  - element: support-assistant
    category: stride/elevation_of_privilege
    verdict: threat
    nodes: [LLM02, LLM05]
    summary: >-
      Text a shopper writes reaches the prompt of a process that holds a refund
      tool.
    detail: >-
      `untrusted_input` records that the shopper's message and the order's
      free-text delivery note both go into the prompt verbatim, and `authority`
      gives the process a tool that moves money: refund the order in the open
      ticket, capped at EUR 50. Nothing in the model separates instruction from
      data at the point the tool call is decided, so a delivery note written to
      read like an instruction is indistinguishable from the system prompt. The
      cap bounds one loss rather than the number of them — placing orders is
      something the attacker already does, and every order carries its own note.

  - element: support-assistant
    category: stride/information_disclosure
    verdict: threat
    nodes: [LLM08]
    summary: >-
      A draft can restate the delivery address that the console deliberately
      masks.
    detail: >-
      `support-console`'s `authz` masks addresses unless the agent opens a
      ticket-linked view. `assist-request` hands this process `address` with no
      such condition, and `output_handling` puts the draft in front of the agent
      as text. A draft that quotes the address to answer a delivery question
      therefore puts it on the agent's screen by a path the masking rule never
      sees. The control and the way around it are one element apart in this
      model.

  - element: support-assistant
    category: linddun/unawareness
    verdict: threat
    nodes: [U.1.1]
    summary: >-
      The shopper is not told a model read their message or wrote the reply
      they receive.
    detail: >-
      `assist-request` carries `shopper-message`, `order` and `address` into a
      language model, and `output_handling` sends the result out under a named
      support agent. No flow in the model informs the shopper that either
      happened. The reply is a statement about them, generated rather than
      looked up — `draft-reply.notes` says as much — and the one path that
      exists for a shopper to ask what is held about them, `dsar-request`, has
      no way to surface a prompt they were never told about.

  - element: support-assistant
    category: stride/spoofing
    verdict: controlled
    reason: >-
      `authn` is an IAM role with no public route; only `support-console` can
      reach it. Impersonating the caller means holding the console's identity,
      which is recorded against `support-console`.

  - element: support-assistant
    category: stride/tampering
    verdict: controlled
    reason: >-
      `system_prompt` is held in the repository and shipped with the service,
      not editable from the console and not assembled from anything a shopper
      writes. Changing what the process is told to do means changing the
      deployed artefact. Tampering with the data inside the prompt is the
      elevation of privilege finding above rather than a second one.

  - element: support-assistant
    category: stride/repudiation
    verdict: controlled
    reason: >-
      `logging` records the prompt, every tool call and every refund decision to
      `audit-log`, which is append-only with object lock. Neither the process nor
      the agent who accepted a draft can deny a refund.

  - element: support-assistant
    category: stride/denial_of_service
    verdict: controlled
    reason: >-
      Reachable only from `support-console`, which is behind Okta SSO with
      WebAuthn. Losing it degrades to an agent writing the reply themselves,
      since `output_handling` already requires them to press send.

  - element: support-assistant
    category: linddun/linking
    verdict: controlled
    reason: >-
      `tech` records that no conversation state is kept between tickets, and
      `authority` scopes the process to the order in the open one. Nothing here
      joins two tickets or two shoppers.

  - element: support-assistant
    category: linddun/identifying
    verdict: controlled
    reason: >-
      It works on an identified order because the ticket is about one, and
      `authority` holds it there. Identification is the function rather than a
      side effect.

  - element: support-assistant
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      Deliberate, per `audit-event.notes`: the prompt and the tool calls are
      logged precisely so a refund is attributable.

  - element: support-assistant
    category: linddun/detecting
    verdict: not_applicable
    reason: >-
      `authn` records no inbound path from outside `prod-vpc`. Nothing outside
      can time it or watch it respond.

  - element: support-assistant
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      `assist-request` carries `order`, `address` and `shopper-message` and not
      `email` — the console already knows who it is talking to, so the
      identifier stays out. The address travels because the questions this
      process answers are about delivery. What it then does with the address is
      the information disclosure finding above.

  - element: support-assistant
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      `output_handling` keeps a named agent between every generated statement
      and the shopper, so nothing the shopper reads is an automated decision.
      The one thing decided without a human is a refund under EUR 50, which runs
      in the shopper's favour. What is not covered is telling them any of this
      happened, and that is the unawareness finding above.

  - element: dsar-handler
    category: stride/spoofing
    verdict: threat
    nodes: [AA01]
    summary: >-
      For a guest, the only thing between a stranger and somebody else's data is
      documentary proof a human judges.
    detail: >-
      `dsar-request.authn` is "Identity verification against the account, or
      documentary proof for guests", and its `notes` admit "Guest checkout makes
      verification harder, since there is no account to prove". An account
      holder proves control of the login; a guest presents documents to a
      privacy team member with no baseline to compare them against. The same
      root cause as the `shopper` spoofing finding, but a worse outcome: there
      the attacker misdirects one order, here they obtain a complete export.

  - element: dsar-handler
    category: stride/tampering
    verdict: controlled
    reason: >-
      `authz` is a two-person rule on erasure runs, so the destructive path
      needs two identities. `dsar-read.authn` restricts the read to an approved
      run rather than to anyone holding the role.

  - element: dsar-handler
    category: stride/repudiation
    verdict: controlled
    reason: >-
      `logging` is a full audit trail of every request, approval and export,
      into the append-only `audit-log`. Both the requester and the approver are
      recorded.

  - element: dsar-handler
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      Reads are limited to approved runs and the export goes out over TLS 1.3.
      Whether the right person receives it depends on verification, which is
      the spoofing finding above.

  - element: dsar-handler
    category: stride/denial_of_service
    verdict: controlled
    reason: >-
      `dsar-read` is `trigger: manual` behind an approval, so volume is bounded
      by the privacy team rather than by a requester. A flood of requests costs
      human time, which is a staffing problem rather than an availability one.

  - element: dsar-handler
    category: stride/elevation_of_privilege
    verdict: controlled
    reason: >-
      The job holds the broadest read in the system, and the two-person rule on
      erasure plus approval-scoped reads are what keep that from being usable
      by one person alone.

  - element: dsar-handler
    category: linddun/linking
    verdict: controlled
    reason: >-
      Assembling everything held about one person is exactly the linkage a
      subject access request requires. Doing it for the wrong person is the
      spoofing finding, not a linking one.

  - element: dsar-handler
    category: linddun/identifying
    verdict: controlled
    reason: >-
      It works from an identified `email` supplied by the requester. No
      pseudonymous data is resolved beyond what the request itself asks for.

  - element: dsar-handler
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      Its audit trail attributes approvals to staff, which `audit-event` records
      as a deliberate accepted cost. A shopper's own request being recorded is
      what makes the response defensible.

  - element: dsar-handler
    category: linddun/detecting
    verdict: controlled
    reason: >-
      A request arrives before any response exists, and the reply goes only to
      the verified requester. Whether an unknown address is distinguishable from
      a known one is recorded against `checkout-api`, where the lookup happens.

  - element: dsar-handler
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      `dsar-read` carries `order`, `address` and `email` — everything held, which
      is what an access request is for. Sending less would fail the request
      rather than minimise it.

  - element: dsar-handler
    category: linddun/unawareness
    verdict: threat
    nodes: [U.2.2, U.2.3]
    summary: >-
      A guest who cannot produce documents is locked out of their own data by
      the same control that protects it.
    detail: >-
      `dsar-request.authn` offers account verification or documentary proof, and
      its `notes` record that guests have no account to prove. Tightening the
      check to stop the spoofing finding above makes this worse, and loosening
      it makes that one worse — the two are the same dial. Nothing in the model
      records where the dial is set, who decides, or what happens to a guest
      whose documents are judged insufficient. That is a lack of access and
      erasure control, arrived at by accident rather than by decision.

  - element: dsar-handler
    category: linddun/non_compliance
    verdict: threat
    nodes: [NC.1.1.1]
    summary: >-
      Gift recipients are data subjects the rights process cannot serve at all.
    detail: >-
      `address` records `subjects: Shoppers and their gift recipients`, so a
      recipient's personal data is processed. Every route into this process
      starts from a shopper: `dsar-request` comes `from: shopper`, and
      verification is against a shopper's account. A recipient has no account,
      no order of their own to name, and no relationship to prove — so there is
      no path by which they could exercise access or erasure. This is the
      compliance face of the `shopper` unawareness finding, recorded here
      because this is the process that would have to serve them.

  # --- stores --------------------------------------------------------------

  - element: orders-db
    category: stride/tampering
    verdict: controlled
    reason: >-
      `access_control` is service roles only, with human access break-glass
      through PAM and an alert to the on-call. Write paths are `persist-order`
      with IAM database authentication; every other reader holds a read-only
      role.

  - element: orders-db
    category: stride/repudiation
    verdict: not_applicable
    reason: >-
      Repudiation against a store applies to a store that is itself the
      evidence, and this one is not: order changes and support lookups are
      recorded in `audit-log`, which is append-only with object lock. Altering
      `orders-db` destroys the current state, not the record of how it got
      there.

  - element: orders-db
    category: stride/information_disclosure
    verdict: threat
    nodes: [DR01]
    summary: >-
      The backups sit in the same account under the same KMS key, so they add
      no isolation from the compromise that matters.
    detail: >-
      `encryption_at_rest` is AES-256 under a customer-managed KMS key, and
      `backups` are "Nightly snapshots retained 35 days in the same account,
      same KMS key". Whoever can decrypt the live database can decrypt every
      snapshot, and whoever holds the account holds both. The encryption
      defends against a stolen disk, which is not how this database would be
      read; it does not defend against the credential compromise that is.

  - element: orders-db
    category: stride/denial_of_service
    verdict: controlled
    reason: >-
      Nightly snapshots retained 35 days are a recovery path for destruction,
      and `access_control` keeps the delete privilege behind PAM with an alert.
      Exhaustion through the order path is recorded against `checkout-api`,
      where the unthrottled entry point is.

  - element: orders-db
    category: linddun/linking
    verdict: controlled
    reason: >-
      It holds `order`, `address` and `email` joined per shopper, which is the
      linkage the contract basis is recorded for. `cart`'s own note that
      purchase history becomes linkable once joined to an order describes this
      store working as intended.

  - element: orders-db
    category: linddun/identifying
    verdict: controlled
    reason: >-
      Everything here is identified data collected from the person it concerns.
      `email` carries a note that it cannot be pseudonymised because it is the
      login identifier, which is a recorded decision rather than an oversight.

  - element: orders-db
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      `order` is kept 7 years under a tax obligation, so a shopper cannot deny
      a purchase for that period. That is the obligation, not a threat the
      model can design away.

  - element: orders-db
    category: linddun/detecting
    verdict: not_applicable
    reason: >-
      The store answers no query from outside `prod-vpc`. Every reader —
      `checkout-api`, `fulfilment-worker`, `support-console`, `dsar-handler` —
      is an authenticated service, so there is no response an observer could
      infer membership from.

  - element: orders-db
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      It holds the three items the order needs and no more, each with a
      recorded `lawful_basis`. The retention question is real and recorded
      under non-compliance below, where the deadline lives.

  - element: orders-db
    category: linddun/non_compliance
    verdict: threat
    nodes: [NC.1.1.4]
    summary: >-
      Nobody could say whether the 90-day address purge reaches the snapshots,
      so addresses may persist 35 days past their stated retention.
    detail: >-
      `retention` promises addresses are "purged 90 days after delivery", and
      `backups` are "Nightly snapshots retained 35 days". The model's own
      `open_questions` records that nobody could confirm whether the snapshots
      are covered by the purge. If they are not, the stated retention is false
      by up to 35 days for every address, and a storage-limitation commitment
      that is false is worse than one never made — it is the thing a regulator
      would be shown. This is the model's unanswerable question promoted, which
      is what those questions are for.

  - element: audit-log
    category: stride/tampering
    verdict: controlled
    reason: >-
      `access_control` is write-only for services, and `encryption_at_rest`
      records object lock preventing deletion before expiry. No path in the
      model can rewrite an entry, including the services that wrote it.

  - element: audit-log
    category: stride/repudiation
    verdict: controlled
    reason: >-
      This is the store that is the evidence, which is why the check applies
      here and not to the other two. Append-only with object lock, replicated
      cross-region, and written by three separate processes over authenticated
      flows.

  - element: audit-log
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      `access_control` requires a security team role to read, and the writers
      hold write-only credentials. An attacker who compromises a service gains
      the ability to add noise, not to read the history.

  - element: audit-log
    category: stride/denial_of_service
    verdict: controlled
    reason: >-
      Cross-region replication with a matching 2-year expiry survives the loss
      of a region. Flooding it with events requires compromising a writer,
      which is that writer's finding rather than this store's.

  - element: audit-log
    category: linddun/linking
    verdict: controlled
    reason: >-
      `audit-event` links staff actions to shoppers' orders, which is the point
      of an audit record and its recorded `lawful_basis: Legal obligation`.

  - element: audit-log
    category: linddun/identifying
    verdict: controlled
    reason: >-
      It holds `email` and identified staff names because an audit trail that
      cannot name who did what to whom is not one.

  - element: audit-log
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      `audit-event` records this explicitly: "Deliberately non-repudiable for
      staff, which is a LINDDUN cost accepted on purpose". A decision on the
      record, not a hole.

  - element: audit-log
    category: linddun/detecting
    verdict: not_applicable
    reason: >-
      Reading it needs a security team role and there is no path from outside
      `prod-vpc`. Nothing here is observable by someone who could learn a
      person's involvement from it.

  - element: audit-log
    category: linddun/data_disclosure
    verdict: threat
    nodes: [DD.3.4, DD.3.2]
    summary: >-
      `email` is kept here for 2 years, well past the retention promised for it
      everywhere else.
    detail: >-
      `data` is `[audit-event, email]` and `retention` is "2 years, then hard
      delete". But `email` itself records `retention: Life of account plus 30
      days`, and `support-audit` carries `email` into this store on every
      support lookup. So a shopper who closes their account still has their
      email address here for up to two years, in a second copy nobody
      described as a copy. Either the audit record needs the address or it
      needs a pseudonym, and the model does not say which was decided.

  - element: audit-log
    category: linddun/non_compliance
    verdict: threat
    nodes: [NC.1.1.1]
    summary: >-
      An erasure request cannot reach an append-only store with object lock, so
      it cannot be fully honoured.
    detail: >-
      `dsar-handler` erases on a two-person rule, and `dsar-read` reads only
      `orders-db`. This store holds `email` under object lock that "prevents
      deletion before expiry", so by construction the erasure path cannot touch
      it. That may well be defensible — a legal-obligation record can outlive an
      erasure request — but the model records no such decision, so today the
      difference between "we erased everything" and "we erased everything we
      could reach" is undocumented. The honest version of this is a stated
      exception, not silence.

  - element: session-cache
    category: stride/tampering
    verdict: controlled
    reason: >-
      `access_control` is the Checkout API service role only, and
      `session-write.authn` is Redis AUTH plus a security group. Nothing else
      in the model has a path to it.

  - element: session-cache
    category: stride/repudiation
    verdict: not_applicable
    reason: >-
      Not an evidence store. Sessions are working state with a 30-minute TTL;
      what a shopper did is recorded in `audit-log` through `checkout-api`.

  - element: session-cache
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      `encryption_at_rest` is "In-memory only, encrypted volume; no persistence
      to disk" and `retention` is a 30-minute TTL with nothing surviving a
      restart, so there is very little here to read and not for long. The
      accepted gap on `backups` is consistent with that.

  - element: session-cache
    category: stride/denial_of_service
    verdict: threat
    nodes: [DO02]
    summary: >-
      Nothing survives a restart, and nothing in the model says what happens to
      a shopper mid-checkout when one occurs.
    detail: >-
      `retention` records "30-minute TTL; nothing survives a restart", and
      `backups: null` is an accepted gap. A restart or an eviction under memory
      pressure therefore drops every live session at once: `session-read`
      returns nothing and `checkout-api` loses the cart and the shopper's
      context for everyone simultaneously. Whether that degrades to a re-login
      or to a failed order is not recorded anywhere, and the failure is
      correlated across all shoppers rather than spread.

  - element: session-cache
    category: linddun/linking
    verdict: controlled
    reason: >-
      `session-id` carries `notes: Links otherwise separate requests to one
      person; a classic linkability vector`, which is exactly what this store
      exists to do. The control is the bound: a 30-minute TTL, nothing
      persisted, and `lawful_basis: Legitimate interests` recorded for it.

  - element: session-cache
    category: linddun/identifying
    verdict: controlled
    reason: >-
      It maps `session-id` to a shopper id, which is identification within our
      own system rather than a pseudonym being broken. The identifiers never
      leave `prod-vpc`.

  - element: session-cache
    category: linddun/non_repudiation
    verdict: not_applicable
    reason: >-
      Nothing here is evidence of an action. A session id expiring in thirty
      minutes cannot be used to hold anybody to a claim.

  - element: session-cache
    category: linddun/detecting
    verdict: not_applicable
    reason: >-
      Reachable only by the Checkout API service role inside `prod-vpc`, with
      no response path to an observer. Timing observable from outside belongs
      to the flows and to `checkout-api`.

  - element: session-cache
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      It holds `session-id` and `cart` and neither `email` nor `address`, which
      is the minimisation a session needs. The 30-minute TTL bounds the
      duration as well as the content.

  - element: session-cache
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      Both items carry a `lawful_basis` of legitimate interests and a 30-minute
      retention that the TTL actually enforces, which is the rare case of a
      stated retention implemented by the mechanism rather than by a job that
      might not run.

  # --- flows ---------------------------------------------------------------

  - element: browse
    category: stride/tampering
    verdict: controlled
    reason: >-
      The cart is built inside `trust_zone: browser`, so the shopper can set it
      to anything; `checkout-web.authz` records that every decision is re-made
      server-side, and `checkout-api.authz` re-checks on the way in.
  - element: browse
    category: stride/information_disclosure
    verdict: not_applicable
    reason: >-
      `encryption_in_transit` is "n/a — never leaves the browser". There is no
      channel to intercept; the data is already on the observer's own machine.
  - element: browse
    category: stride/denial_of_service
    verdict: not_applicable
    reason: >-
      An in-page interaction a shopper can only deny to themselves.
  - element: browse
    category: linddun/linking
    verdict: controlled
    reason: >-
      `cart` is pseudonymous and stays in the page until checkout. The linkage
      to a person happens at `submit-order`, under the contract basis.
  - element: browse
    category: linddun/identifying
    verdict: not_applicable
    reason: >-
      Carries `cart` only, and `authn` is "n/a — anonymous until checkout".
      Nothing in the flow could identify anybody.
  - element: browse
    category: linddun/non_repudiation
    verdict: not_applicable
    reason: >-
      Nothing is recorded, signed or retained, so nothing here could be used to
      stop a shopper denying anything.
  - element: browse
    category: linddun/detecting
    verdict: not_applicable
    reason: >-
      Never leaves the browser, so there is no traffic or side effect from
      which an observer could deduce involvement.
  - element: browse
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      `cart` carries `lawful_basis: Legitimate interests` and a 30-minute
      retention. Building a cart is the minimum the transaction needs.
  - element: browse
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      Pseudonymous data under a recorded legitimate-interests basis. That the
      shopper is never told is real and recorded against `checkout-web`, where
      a notice would have to live.

  - element: tokenise-card
    category: stride/tampering
    verdict: controlled
    reason: >-
      TLS 1.3 to Stripe with `authn` a publishable key. Tampering with a
      tokenisation request produces a token for the attacker's own card, which
      `charge` then fails to settle against our order.
  - element: tokenise-card
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      This is the flow the model's first assumption rests on — "Card numbers
      never reach our servers; Stripe Elements tokenises in-browser" — so the
      card number is exposed to the browser and Stripe and to nothing of ours.
      TLS 1.3 covers the hop.
  - element: tokenise-card
    category: stride/denial_of_service
    verdict: controlled
    reason: >-
      Stripe's availability, not ours. `charge` failing is recorded against
      `checkout-api`, which is the process that depends on it.
  - element: tokenise-card
    category: linddun/linking
    verdict: controlled
    reason: >-
      `card-token` carries `notes: Meaningless without Stripe's vault, but
      links a shopper to a payment instrument`. The linkage is Stripe's to make
      and is what settling a payment requires.
  - element: tokenise-card
    category: linddun/identifying
    verdict: not_applicable
    reason: >-
      `card-token` is `personal_data: pseudonymous` with `examples: tok_1A2b3C`
      and is meaningless without Stripe's vault, which we have no access to.
      Nothing in this flow can be resolved to a person by us or by an observer.
  - element: tokenise-card
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      A token is not evidence of a purchase; `charge-result` and the audit log
      are. Non-repudiation of payment is Stripe's record and ours jointly.
  - element: tokenise-card
    category: linddun/detecting
    verdict: controlled
    reason: >-
      An observer on the shopper's network sees a request to Stripe, which
      reveals that they are paying for something somewhere. TLS 1.3 with SNI is
      the state of the art available; the destination being observable is a
      property of the internet rather than of this design.
  - element: tokenise-card
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      Carries only `card-token`. Routing the card number around our servers
      entirely is the strongest minimisation in the model.
  - element: tokenise-card
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      `card-token` records `retention: Not stored; passed through and
      discarded` under a contract basis, and Stripe is named in scope as a
      third-party service rather than left implicit.

  - element: submit-order
    category: stride/tampering
    verdict: controlled
    reason: >-
      The model's most sensitive boundary crossing — `browser` to `prod-vpc`
      with `cart`, `address`, `email` and `card-token` — and the one with the
      most recorded: TLS 1.3, a SameSite=Lax session cookie, a CSRF token, and
      row-level ownership re-checked in `checkout-api.authz`.
  - element: submit-order
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      TLS 1.3 on the wire. What the shopper's own browser can see of their own
      order is not disclosure; what an error report might carry is recorded
      against `checkout-web`.
  - element: submit-order
    category: stride/denial_of_service
    verdict: threat
    nodes: [DO01]
    summary: >-
      The one unauthenticated-reachable write path in the model, with no
      throttle recorded on it.
    detail: >-
      `trigger: user_action` from `trust_zone: browser`, and a guest needs no
      account to use it. Every request behind it costs a database write through
      `persist-order` and a third-party call through `charge`. No field in the
      model records a rate limit, a quota or a queue. This is the flow face of
      the `checkout-api` availability finding: recorded separately because the
      fix belongs at the edge, before the request reaches the process.
  - element: submit-order
    category: linddun/linking
    verdict: controlled
    reason: >-
      This is where `cart` stops being pseudonymous and becomes linked to a
      person, exactly as `cart.notes` describes. It is the transaction, under a
      recorded contract basis.
  - element: submit-order
    category: linddun/identifying
    verdict: controlled
    reason: >-
      `email` and `address` arrive identified, from the person they belong to.
      For a guest, that the address is unverified is the `shopper` spoofing
      finding rather than an identification threat.
  - element: submit-order
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      The order this creates is deliberately non-repudiable for tax purposes —
      `order` carries a 7-year retention — and `audit-write` records it.
  - element: submit-order
    category: linddun/detecting
    verdict: controlled
    reason: >-
      One HTTPS POST among many to the same host. An observer learns that
      somebody bought something, not who or what.
  - element: submit-order
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      Four items, each needed: `cart` and `card-token` to charge, `address` to
      deliver, `email` to confirm. Each carries a `lawful_basis` in the
      dictionary.
  - element: submit-order
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      Collection under the contract basis recorded for every item it carries.
      The absent notice is recorded against `checkout-web`, and retention
      against the store that keeps it.

  - element: charge
    category: stride/tampering
    verdict: controlled
    reason: >-
      TLS 1.3 with `authn` a restricted secret key rotated quarterly, from
      `prod-vpc` where `access_control` keeps the key out of reach.
  - element: charge
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      Carries `card-token` and `order`, never a card number — the model's first
      assumption. A restricted key limits what a leaked credential could read
      back from Stripe.
  - element: charge
    category: stride/denial_of_service
    verdict: controlled
    reason: >-
      Stripe's availability. What it costs us when unthrottled is recorded
      against `checkout-api` and `submit-order`.
  - element: charge
    category: linddun/linking
    verdict: controlled
    reason: >-
      Joins `card-token` to `order`, which is settling a payment. The linkage
      lives in Stripe's vault under our contract with them.
  - element: charge
    category: linddun/identifying
    verdict: controlled
    reason: >-
      `order` is identified data going to a named processor in scope. Stripe
      necessarily learns who is paying; that is what a payment processor does.
  - element: charge
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      A settled charge is meant to be undeniable by both parties. That is the
      purpose of the record, and `charge-result` arrives signed.
  - element: charge
    category: linddun/detecting
    verdict: controlled
    reason: >-
      Server-to-server inside TLS 1.3, from a VPC with no inbound path. An
      observer sees our traffic to Stripe in aggregate, not a person in it.
  - element: charge
    category: linddun/data_disclosure
    verdict: controlled
    reason: >-
      Two items, both required to settle. No `address` and no `email` are sent
      to Stripe, which is more minimisation than the integration needed.
  - element: charge
    category: linddun/non_compliance
    verdict: controlled
    reason: >-
      Stripe is declared in scope as a third-party service with its own trust
      zone and `controlled_by: third_party`, so the transfer is modelled rather
      than hidden inside a process.

  - element: charge-result
    category: stride/tampering
    verdict: controlled
    reason: >-
      `authn` is webhook signature verification, which is precisely the control
      for an inbound claim from a third party. Without it anybody could assert
      that an order was paid.
  - element: charge-result
    category: stride/information_disclosure
    verdict: controlled
    reason: >-
      TLS 1.3, carrying `order` only. Nothing about the payment instrument
      comes back.
  - element: charge-result
    category: stride/denial_of_service
    verdict: controlled
    reason: >-
      A webhook endpoint is a public surface, but signature verification
      rejects unsigned traffic before it reaches any order logic. The cost of a
      flood is recorded against `checkout-api`.
  - element: charge-result
    category: linddun/linking
    verdict: controlled
    reason: >-
      Returns an outcome against an `order` we already hold. No new linkage is
      created by it.
  - element: charge-result
    category: linddun/identifying
    verdict: controlled
    reason: >-
      `order` is already identified on our side. The response adds a payment
      outcome, not an identity.
  - element: charge-result
    category: linddun/non_repudiation
    verdict: controlled
    reason: >-
      Signed by Stripe, which is what makes the settlement provable. Deliberate.
  - element: charge-result
    category: linddun/detecting
