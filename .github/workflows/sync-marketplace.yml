name: Sync marketplace.json and README

on:
  push:
    branches: [main]
    paths:
      - 'plugins/*/.claude-plugin/plugin.json'
      - '.claude-plugin/marketplace.json'
      - 'README.md'
      - '.github/scripts/sync_marketplace.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-marketplace
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: python .github/scripts/sync_marketplace.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "marketplace.json and README.md already in sync"
            exit 0
          fi
          git add .claude-plugin/marketplace.json README.md
          git diff --cached
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync marketplace.json and README from plugin manifests"
          git pull --rebase origin main
          git push origin HEAD:main
