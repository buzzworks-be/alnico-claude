name: On commit

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check marketplace.json against plugin manifests
        shell: python
        run: |
          import json, pathlib, sys

          root = pathlib.Path(".")
          market = json.loads((root / ".claude-plugin/marketplace.json").read_text())
          errors = []

          for entry in market["plugins"]:
              name = entry["name"]
              manifest_path = root / entry["source"] / ".claude-plugin/plugin.json"
              if not manifest_path.is_file():
                  errors.append(f"{name}: missing {manifest_path}")
                  continue
              manifest = json.loads(manifest_path.read_text())
              if manifest.get("name") != name:
                  errors.append(f"{name}: plugin.json name is {manifest.get('name')!r}")
              if manifest.get("version") != entry.get("version"):
                  errors.append(
                      f"{name}: marketplace version {entry.get('version')} "
                      f"!= plugin.json version {manifest.get('version')}"
                  )

          listed = {pathlib.Path(e["source"]).name for e in market["plugins"]}
          for d in sorted((root / "plugins").iterdir()):
              if d.is_dir() and d.name not in listed:
                  errors.append(f"{d.name}: plugin directory not listed in marketplace.json")

          for e in errors:
              print(f"::error file=.claude-plugin/marketplace.json::{e}")
          sys.exit(1 if errors else 0)
